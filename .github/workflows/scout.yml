name: Job Scout

# Runs once every morning. Cron is in UTC: 13:30 UTC = 6:30am Pacific / 9:30am Eastern.
# Adjust the cron if you want a different time. You can also trigger it by hand
# from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run Job Scout
        env:
          # Both come from repo Settings -> Secrets and variables -> Actions.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py

# Dedup is handled by the Google Sheet itself (the ID column), so no local
# state needs to persist between runs.
